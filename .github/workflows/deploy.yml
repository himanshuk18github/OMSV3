
name: Deploy OMSV3 - app.apnistationery.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-app-apnistationery-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEPLOY_DOMAIN: app.apnistationery.com

      SSH_HOST: 45.199.139.18
      SSH_PORT: "22"
      SSH_USER: blackwat1

      SERVER_ROOT: /var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2
      REPO_DIR: /var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery
      WEB_DIR: /var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/domains/app.apnistationery/public_html
      BACKEND_DIR: /var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/backend
      FRONTEND_DIR: /var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/frontend
      STAGING_DIR: /var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/.deploy-staging

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Validate repository
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f backend/composer.json
          test -f backend/artisan
          test -f frontend/package.json
          test "${DEPLOY_DOMAIN}" = "app.apnistationery.com"
          test "${SSH_HOST}" = "45.199.139.18"
          test "${SSH_PORT}" = "22"
          test "${SSH_USER}" = "blackwat1"
          test "${REPO_DIR}" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery"
          test "${WEB_DIR}" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/domains/app.apnistationery/public_html"
          test "${BACKEND_DIR}" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/backend"
          test "${FRONTEND_DIR}" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/frontend"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql
          tools: composer:2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build React frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://app.apnistationery.com/api/index.php/api
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi
          npm run build
          test -f dist/index.html

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify server and locked paths
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          ${SSH} "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SERVER_ROOT="/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2"
          REPO_DIR="$SERVER_ROOT/repositories/app.apnistationery"
          WEB_DIR="$SERVER_ROOT/domains/app.apnistationery/public_html"

          test "$(whoami)" = "blackwat1"
          test -d "$SERVER_ROOT"
          mkdir -p "$REPO_DIR" "$WEB_DIR"

          test "$REPO_DIR" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery"
          test "$WEB_DIR" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/domains/app.apnistationery/public_html"
          REMOTE

      - name: Prepare deployment directories
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          ${SSH} "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SERVER_ROOT="/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2"
          REPO_DIR="$SERVER_ROOT/repositories/app.apnistationery"
          WEB_DIR="$SERVER_ROOT/domains/app.apnistationery/public_html"
          STAGING_DIR="$REPO_DIR/.deploy-staging"

          test "$REPO_DIR" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery"
          test "$WEB_DIR" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/domains/app.apnistationery/public_html"
          test "$STAGING_DIR" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/.deploy-staging"

          mkdir -p "$REPO_DIR/backend" "$REPO_DIR/frontend" "$STAGING_DIR/backend" "$STAGING_DIR/frontend_dist" "$STAGING_DIR/api" "$WEB_DIR"
          REMOTE

      - name: Upload backend
        shell: bash
        run: |
          set -Eeuo pipefail
          RSYNC_SSH="ssh -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          rsync -az --delete \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="storage/logs/*" \
            -e "$RSYNC_SSH" \
            backend/ "${SSH_USER}@${SSH_HOST}:${BACKEND_DIR}/"

      - name: Upload frontend source
        shell: bash
        run: |
          set -Eeuo pipefail
          RSYNC_SSH="ssh -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          rsync -az --delete -e "$RSYNC_SSH" \
            frontend/ "${SSH_USER}@${SSH_HOST}:${FRONTEND_DIR}/"

      - name: Upload built frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          RSYNC_SSH="ssh -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          rsync -az --delete -e "$RSYNC_SSH" \
            frontend/dist/ "${SSH_USER}@${SSH_HOST}:${STAGING_DIR}/frontend_dist/"

      - name: Prepare Laravel API
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          ${SSH} "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SERVER_ROOT="/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2"
          REPO_DIR="$SERVER_ROOT/repositories/app.apnistationery"
          BACKEND_DIR="$REPO_DIR/backend"
          API_DIR="$REPO_DIR/.deploy-staging/api"

          test "$BACKEND_DIR" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/backend"
          mkdir -p "$API_DIR"

          cat > "$API_DIR/.htaccess" <<'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{HTTP:Authorization} .
            RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^ index.php [L]
          </IfModule>
          EOF

          cat > "$API_DIR/index.php" <<'EOF'
          <?php
          use Illuminate\Contracts\Http\Kernel;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          $backendRoot = '/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/backend';

          if (file_exists($maintenance = $backendRoot . '/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          require $backendRoot . '/vendor/autoload.php';
          $app = require_once $backendRoot . '/bootstrap/app.php';
          $kernel = $app->make(Kernel::class);
          $request = Request::capture();
          $response = $kernel->handle($request);
          $response->send();
          $kernel->terminate($request, $response);
          EOF
          REMOTE

      - name: Prepare frontend routing
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          ${SSH} "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SERVER_ROOT="/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2"
          FRONTEND_STAGE="$SERVER_ROOT/repositories/app.apnistationery/.deploy-staging/frontend_dist"

          test "$FRONTEND_STAGE" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/.deploy-staging/frontend_dist"

          cat > "$FRONTEND_STAGE/.htaccess" <<'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            RewriteCond %{REQUEST_URI} !^/api(/|$) [NC]
            RewriteRule ^ index.html [L]
          </IfModule>
          EOF
          REMOTE

      - name: Publish frontend and API
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          ${SSH} "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SERVER_ROOT="/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2"
          REPO_DIR="$SERVER_ROOT/repositories/app.apnistationery"
          WEB_DIR="$SERVER_ROOT/domains/app.apnistationery/public_html"
          FRONTEND_STAGE="$REPO_DIR/.deploy-staging/frontend_dist"
          API_STAGE="$REPO_DIR/.deploy-staging/api"
          BACKUP_DIR="$REPO_DIR/.deploy-staging/previous_public"

          test "$REPO_DIR" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery"
          test "$WEB_DIR" = "/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/domains/app.apnistationery/public_html"
          test -f "$FRONTEND_STAGE/index.html"
          test -f "$API_STAGE/index.php"

          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR"
          rsync -a "$WEB_DIR/" "$BACKUP_DIR/" || true

          mkdir -p "$WEB_DIR/api"
          rsync -a --delete "$FRONTEND_STAGE/" "$WEB_DIR/"
          rsync -a --delete "$API_STAGE/" "$WEB_DIR/api/"
          REMOTE

      - name: Verify production environment and database
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          ${SSH} "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          BACKEND_DIR="/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/backend"

          test -f "$BACKEND_DIR/.env"
          test -f "$BACKEND_DIR/artisan"
          test -d "$BACKEND_DIR/vendor"

          cd "$BACKEND_DIR"

          echo "=== PHP ==="
          php -v | head -n 1

          echo "=== Laravel ==="
          php artisan --version

          echo "=== Database connectivity ==="
          php artisan migrate:status

          echo "Production environment and database are reachable."
          REMOTE

      - name: Run database migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          ${SSH} "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          BACKEND_DIR="/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/backend"
          cd "$BACKEND_DIR"

          php artisan migrate --force --no-interaction
          REMOTE

      - name: Finalize Laravel production
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          ${SSH} "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          BACKEND_DIR="/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/repositories/app.apnistationery/backend"
          WEB_DIR="/var/www/25bf262f-e1b5-4d4f-91a0-2f52bbf540c2/domains/app.apnistationery/public_html"

          cd "$BACKEND_DIR"

          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear
          php artisan storage:link || true
          php artisan optimize

          test -f "$WEB_DIR/index.html"
          test -f "$WEB_DIR/api/index.php"
          test -f "$WEB_DIR/api/.htaccess"
          test -f "$BACKEND_DIR/vendor/autoload.php"
          test -f "$BACKEND_DIR/artisan"

          echo "=========================================="
          echo "OMSV3 PRODUCTION DEPLOYMENT PASSED"
          echo "=========================================="
          REMOTE
