name: Build and Deploy

on:
  push:
    branches: [ main, clean-backend-frontend ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          tools: composer:2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: ./backend
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://app.apnistationery.com/api
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Create artifact
        run: |
          mkdir -p /tmp/artifact
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='artifact.tar.gz' . /tmp/artifact/
          tar -C /tmp/artifact -czf artifact.tar.gz .

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure remote directories (with connectivity test)
        run: |
          echo "Testing SSH connectivity to ${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT || '22' }}"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'echo SSH_OK' || {
            echo "SSH connectivity test failed. Check SSH_HOST, SSH_PORT, and firewall settings."
            exit 2
          }
      - name: Ensure remote directories
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 180s
          command_timeout: 20m
          script: |
            mkdir -p ${{ secrets.TARGET_DIR }}
            mkdir -p ${{ secrets.PUBLIC_DIR }}

      - name: Upload artifact
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 20m
          source: artifact.tar.gz
          target: ${{ secrets.TARGET_DIR }}

      - name: Deploy on remote
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.TARGET_DIR }}
            ls -la
            ARTIFACT_PATH="${{ secrets.TARGET_DIR }}/artifact.tar.gz"
            if [ ! -f "$ARTIFACT_PATH" ]; then
              ARTIFACT_PATH="$(find ${{ secrets.TARGET_DIR }} -type f -name 'artifact.tar.gz' | head -n 1)"
            fi
            if [ -z "$ARTIFACT_PATH" ] || [ ! -f "$ARTIFACT_PATH" ]; then
              echo "artifact.tar.gz not found under ${{ secrets.TARGET_DIR }}"
              exit 1
            fi
            tar -xzf "$ARTIFACT_PATH" -C ${{ secrets.TARGET_DIR }}
            echo "Using CI-built dependencies and assets; skipping remote composer/npm."
            FRONTEND_ROOT="${{ secrets.PUBLIC_DIR }}"
            API_ROOT="${{ secrets.PUBLIC_DIR }}/api"
            # Ensure frontend root exists, sync the built SPA, then create API folder
            mkdir -p "$FRONTEND_ROOT"
            echo "Syncing frontend build to web root: $FRONTEND_ROOT"
            rsync -av --delete "${{ secrets.TARGET_DIR }}/frontend/dist/" "$FRONTEND_ROOT/"
            # Re-create API folder after rsync in case rsync --delete removed it
            mkdir -p "$API_ROOT"
            
            # Create .htaccess for React SPA routing
            {
              echo '<IfModule mod_rewrite.c>'
              echo 'RewriteEngine On'
              echo 'RewriteBase /'
              echo 'RewriteCond %{REQUEST_FILENAME} !-f'
              echo 'RewriteCond %{REQUEST_FILENAME} !-d'
              echo 'RewriteRule ^ index.html [L]'
              echo '</IfModule>'
            } > "$FRONTEND_ROOT/.htaccess"
            
            # Create API index.php that boots Laravel
            {
              echo '<?php'
              echo 'use Illuminate\Foundation\Application;'
              echo 'use Illuminate\Http\Request;'
              echo 'define("LARAVEL_START", microtime(true));'
              echo '$backendRoot = "'"'"'${{ secrets.TARGET_DIR }}/backend'"'"'";'
              echo 'if (file_exists($maintenance = $backendRoot."/storage/framework/maintenance.php")) {'
              echo '  require $maintenance;'
              echo '}'
              echo 'require $backendRoot."/vendor/autoload.php";'
              echo '$app = require_once $backendRoot."/bootstrap/app.php";'
              echo '$app->handleRequest(Request::capture());'
            } > "$API_ROOT/index.php"
            
            ln -sfn ${{ secrets.TARGET_DIR }}/backend/storage/app/public "$API_ROOT"/storage
            ls -la "$FRONTEND_ROOT"
            ls -la "$API_ROOT"
            ENV_PATH="${{ secrets.TARGET_DIR }}/backend/.env"
            if [ -n "${{ secrets.ENV_FILE }}" ]; then
              printf '%s' "${{ secrets.ENV_FILE }}" > "$ENV_PATH"
            elif [ ! -f "$ENV_PATH" ]; then
              cp "${{ secrets.TARGET_DIR }}/backend/.env.example" "$ENV_PATH"
            fi
            if ! grep -q '^APP_KEY=base64:' "$ENV_PATH"; then
              APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"
              if grep -q '^APP_KEY=' "$ENV_PATH"; then
                sed -i "s#^APP_KEY=.*#APP_KEY=$APP_KEY#" "$ENV_PATH"
              else
                echo "APP_KEY=$APP_KEY" >> "$ENV_PATH"
              fi
            fi
            sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' "$ENV_PATH"
            sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' "$ENV_PATH"
            sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' "$ENV_PATH"
            php -r 'if (PHP_VERSION_ID < 80300) { fwrite(STDERR, "WARNING: Server PHP ".PHP_VERSION." is below required 8.3 for this app.\n"); }'
            chown -R ${{ secrets.SSH_USER }}:www-data ${{ secrets.TARGET_DIR }} || true
            chmod -R 775 ${{ secrets.TARGET_DIR }}/backend/storage ${{ secrets.TARGET_DIR }}/backend/bootstrap/cache || true
            if [ -f "${{ secrets.TARGET_DIR }}/backend/artisan" ]; then
              php ${{ secrets.TARGET_DIR }}/backend/artisan config:clear || true
              php ${{ secrets.TARGET_DIR }}/backend/artisan route:clear || true
              php ${{ secrets.TARGET_DIR }}/backend/artisan view:clear || true
            fi
