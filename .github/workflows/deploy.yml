name: Build and Deploy

on:
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_DOMAIN: app.apnistationery.com
      SSH_HOST: 82.112.232.23
      SSH_PORT: 65002
      SSH_USER: u902868468468
      PUBLIC_DIR: /home/u902868468468/domains/app.apnistationery.com/public_html
      TARGET_DIR: ~/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql
          tools: composer:2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://app.apnistationery.com/api/index.php/api
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

          npm run build

      - name: Start SSH Agent
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Validate deployment secrets
        run: |
          set -e

          if [ -z "${{ env.SSH_HOST }}" ]; then
            echo "Missing SSH_HOST"
            exit 1
          fi

          if [ -z "${{ env.SSH_USER }}" ]; then
            echo "Missing SSH_USER"
            exit 1
          fi

          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && [ -z "${{ secrets.SSH_PASSWORD }}" ]; then
            echo "Missing SSH auth: provide SSH_PRIVATE_KEY (preferred) or SSH_PASSWORD (fallback)"
            exit 1
          fi

          echo "DEPLOY_DOMAIN=${{ env.DEPLOY_DOMAIN }}"
          echo "PUBLIC_DIR=${{ env.PUBLIC_DIR }}"
          echo "SSH_HOST=${{ env.SSH_HOST }}"
          echo "SSH_PORT=${{ env.SSH_PORT }}"
          echo "SSH_USER=${{ env.SSH_USER }}"
          if [ -n "${{ secrets.SSH_PASSWORD }}" ]; then
            echo "SSH auth: password (fallback)"
          else
            echo "SSH auth: key"
          fi

      - name: Test SSH connectivity
        run: |
          set -e

          if [ -n "${{ secrets.SSH_PASSWORD }}" ]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
            sshpass -p "${{ secrets.SSH_PASSWORD }}" \
              ssh \
                -o ConnectTimeout=10 \
                -o StrictHostKeyChecking=no \
                -p "${{ env.SSH_PORT }}" \
                "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" \
                'echo SSH_OK'
          else
            ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=no \
              -p "${{ env.SSH_PORT }}" \
              "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" \
              'echo SSH_OK'
          fi

      - name: Ensure remote directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 180s
          command_timeout: 20m
          script: |
            set -e

            TARGET_DIR="$HOME/app"
            PUBLIC_DIR="${{ env.PUBLIC_DIR }}"

            if [ -z "$TARGET_DIR" ]; then
              echo "TARGET_DIR is empty"
              exit 1
            fi

            if [ -z "$PUBLIC_DIR" ]; then
              echo "PUBLIC_DIR is empty"
              exit 1
            fi

            mkdir -p "$TARGET_DIR"
            mkdir -p "$PUBLIC_DIR"

            mkdir -p "$TARGET_DIR/staging/backend"
            mkdir -p "$TARGET_DIR/staging/frontend/dist"

      - name: Upload backend and frontend build
        run: |
          set -e

          SSH_PORT="${{ env.SSH_PORT }}"
          SSH_USER="${{ env.SSH_USER }}"
          SSH_HOST="${{ env.SSH_HOST }}"
          TARGET_DIR="${{ env.TARGET_DIR }}"

          if [ -n "${{ secrets.SSH_PASSWORD }}" ]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
            RSYNC="sshpass -p \"${{ secrets.SSH_PASSWORD }}\" rsync"
            RSYNC_SSH="ssh -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          else
            RSYNC="rsync"
            RSYNC_SSH="ssh -o StrictHostKeyChecking=no -p ${SSH_PORT}"
          fi

          $RSYNC -az --delete \
            -e "$RSYNC_SSH" \
            backend/ \
            "${SSH_USER}@${SSH_HOST}:${TARGET_DIR}/staging/backend/"

          $RSYNC -az --delete \
            -e "$RSYNC_SSH" \
            frontend/dist/ \
            "${SSH_USER}@${SSH_HOST}:${TARGET_DIR}/staging/frontend/dist/"

      - name: Deploy on remote
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 180s
          command_timeout: 30m
          script: |
            set -e

            TARGET_DIR="$HOME/app"
            STAGING_DIR="$TARGET_DIR/staging"

            BACKEND_SOURCE="$STAGING_DIR/backend"
            FRONTEND_SOURCE="$STAGING_DIR/frontend/dist"

            FRONTEND_ROOT="${{ env.PUBLIC_DIR }}"
            API_ROOT="${{ env.PUBLIC_DIR }}/api"

            echo "TARGET_DIR=$TARGET_DIR"
            echo "FRONTEND_ROOT=$FRONTEND_ROOT"
            echo "API_ROOT=$API_ROOT"

            if [ -z "$FRONTEND_ROOT" ] || [ "$FRONTEND_ROOT" = "/" ]; then
              echo "Unsafe FRONTEND_ROOT"
              exit 1
            fi

            if [ -z "$API_ROOT" ] || [ "$API_ROOT" = "/" ]; then
              echo "Unsafe API_ROOT"
              exit 1
            fi

            rm -rf "$API_ROOT"

            mkdir -p "$FRONTEND_ROOT"
            mkdir -p "$API_ROOT"

            echo "Deploying frontend..."
            rsync -a --delete "$FRONTEND_SOURCE/" "$FRONTEND_ROOT/"

            mkdir -p "$API_ROOT"

            echo "Preserving any currently deployed .env if present..."
            if [ -f "$TARGET_DIR/backend/.env" ]; then
              cp "$TARGET_DIR/backend/.env" "$TARGET_DIR/.env.deployed.bak" || true
              echo "Saved existing deployed .env to $TARGET_DIR/.env.deployed.bak"
            fi

            echo "Deploying backend..."
            rsync -a --delete \
              "$BACKEND_SOURCE/" \
              "$TARGET_DIR/backend/"

            BACKEND_SOURCE="$TARGET_DIR/backend"

            echo "Creating API .htaccess..."

            cat > "$API_ROOT/.htaccess" <<'HTACCESS'
            <IfModule mod_rewrite.c>
              RewriteEngine On

              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ index.php [L]
            </IfModule>
            HTACCESS

            echo "Creating SPA .htaccess..."

            cat > "$FRONTEND_ROOT/.htaccess" <<'HTACCESS'
            <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /

              RewriteCond %{REQUEST_FILENAME} -f [OR]
              RewriteCond %{REQUEST_FILENAME} -d
              RewriteRule ^ - [L]

              RewriteCond %{REQUEST_URI} !^/api(/|$) [NC]

              RewriteRule ^ index.html [L]
            </IfModule>
            HTACCESS

            echo "Creating Laravel API bootstrap..."

            cat > "$API_ROOT/index.php" <<PHP
            <?php

            use Illuminate\Foundation\Application;
            use Illuminate\Http\Request;

            define('LARAVEL_START', microtime(true));

            \$backendRoot = '$BACKEND_SOURCE';

            if (file_exists(\$maintenance = \$backendRoot.'/storage/framework/maintenance.php')) {
              require \$maintenance;
            }

            require \$backendRoot.'/vendor/autoload.php';

            /** @var Application \$app */
            \$app = require_once \$backendRoot.'/bootstrap/app.php';

            \$app->handleRequest(Request::capture());
            PHP

            echo "Creating API test endpoint..."

            cat > "$API_ROOT/test_post.php" <<'PHP'
            <?php

            header('Content-Type: application/json');

            echo json_encode([
              'method' => $_SERVER['REQUEST_METHOD'],
              'body' => file_get_contents('php://input'),
            ]);
            PHP

            echo "Creating .env..."

            ENV_PATH="$BACKEND_SOURCE/.env"

            # Restore previously deployed .env if we saved one before overwriting
            if [ -f "$TARGET_DIR/.env.deployed.bak" ]; then
              cp "$TARGET_DIR/.env.deployed.bak" "$ENV_PATH" || true
              echo "Restored deployed .env to $ENV_PATH"

            # If an ENV_FILE secret was provided, use that
            elif [ -n "${{ secrets.ENV_FILE }}" ]; then
              printf '%s' "${{ secrets.ENV_FILE }}" > "$ENV_PATH"

            else
              # Seed a minimal production .env. Encourage providing a real ENV_FILE via secrets.
              cat > "$ENV_PATH" <<'ENVFILE'
              APP_NAME="OMS v3.0"
              APP_ENV=production
              APP_KEY=base64:REPLACE_ME
              APP_DEBUG=false
              APP_URL=https://app.apnistationery.com

              LOG_CHANNEL=stack
              LOG_STACK=single
              LOG_LEVEL=debug

              DB_CONNECTION=mysql
              DB_HOST=127.0.0.1
              DB_PORT=3306
              DB_DATABASE=u902868468_Apnistationery
              DB_USERNAME=u902868468_Himanshuk18
              DB_PASSWORD=

              SESSION_DRIVER=file
              SESSION_LIFETIME=120
              QUEUE_CONNECTION=sync
              CACHE_STORE=file
              ENVFILE

            fi

            if ! grep -q '^APP_KEY=base64:' "$ENV_PATH"; then
              APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"

              if grep -q '^APP_KEY=' "$ENV_PATH"; then
                sed -i "s#^APP_KEY=.*#APP_KEY=$APP_KEY#" "$ENV_PATH"
              else
                echo "APP_KEY=$APP_KEY" >> "$ENV_PATH"
              fi
            fi

            mkdir -p "$BACKEND_SOURCE/storage/framework/cache"
            mkdir -p "$BACKEND_SOURCE/storage/framework/sessions"
            mkdir -p "$BACKEND_SOURCE/storage/framework/views"
            mkdir -p "$BACKEND_SOURCE/storage/logs"
            mkdir -p "$BACKEND_SOURCE/bootstrap/cache"

            chmod -R 775 "$BACKEND_SOURCE/storage" || true
            chmod -R 775 "$BACKEND_SOURCE/bootstrap/cache" || true

            if [ -L "$API_ROOT/storage" ]; then
              rm -f "$API_ROOT/storage"
            fi

            ln -sfn \
              "$BACKEND_SOURCE/storage/app/public" \
              "$API_ROOT/storage" || true

            PHP_BIN="/opt/alt/php84/usr/bin/php"

            if [ ! -x "$PHP_BIN" ]; then
              PHP_BIN=$(which php)
            fi

            echo "Using PHP binary: $PHP_BIN"

            "$PHP_BIN" "$BACKEND_SOURCE/artisan" optimize:clear || true
            # Decide whether to run migrations: only run when DB_CONNECTION=mysql and DB_PASSWORD is set
            DB_CONN=$(grep -E '^DB_CONNECTION=' "$ENV_PATH" | cut -d= -f2 | tr -d '\r"') || true
            DB_PASS=$(grep -E '^DB_PASSWORD=' "$ENV_PATH" | cut -d= -f2 | tr -d '\r"') || true

            if [ "${DB_CONN:-}" = "mysql" ] && [ -n "$DB_PASS" ]; then
              echo "Running migrations against MySQL"
              "$PHP_BIN" "$BACKEND_SOURCE/artisan" migrate --force --no-interaction || true
            else
              echo "Skipping migrations: DB_CONNECTION='$DB_CONN' DB_PASSWORD set: $( [ -n "$DB_PASS" ] && echo yes || echo no )"
            fi
            "$PHP_BIN" "$BACKEND_SOURCE/artisan" config:cache || true
            "$PHP_BIN" "$BACKEND_SOURCE/artisan" route:cache || true
            "$PHP_BIN" "$BACKEND_SOURCE/artisan" view:cache || true

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e

            echo "=== PUBLIC ROOT ==="
            ls -la "${{ env.PUBLIC_DIR }}" || true

            echo "=== API ROOT ==="
            ls -la "${{ env.PUBLIC_DIR }}/api" || true

            echo "=== API INDEX ==="
            sed -n '1,80p' "${{ env.PUBLIC_DIR }}/api/index.php" || true

            echo "=== TEST ENDPOINT ==="
            curl -i --max-time 15 \
              "https://${{ env.DEPLOY_DOMAIN }}/api/test_post.php" || true

            echo "=== LOGIN ENDPOINT ==="
            curl -i --max-time 15 \
              -X POST \
              "https://${{ env.DEPLOY_DOMAIN }}/api/index.php/api/auth/login" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d '{}' || true

            echo "=== PHP VERSION ==="
            /opt/alt/php84/usr/bin/php -v || php -v || true

            echo "=== STORAGE LOGS ==="

            TARGET_DIR="$HOME/app"
            BACKEND_SOURCE="$TARGET_DIR/backend"

            if [ -d "$BACKEND_SOURCE/storage/logs" ]; then
              for f in "$BACKEND_SOURCE"/storage/logs/*.log; do
                echo "--- $f ---"
                tail -n 100 "$f" || true
              done
            fi
