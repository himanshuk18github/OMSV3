name: Build and Deploy

on:
  push:
    branches: [ main, clean-backend-frontend ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN || 'app.apnistationery.com' }}
      TARGET_DIR: ${{ secrets.TARGET_DIR || format('/home/{0}/apps/oms', secrets.SSH_USER) }}
      PUBLIC_DIR: ${{ secrets.PUBLIC_DIR || format('/home/{0}/domains/{1}/public_html', secrets.SSH_USER, secrets.DEPLOY_DOMAIN || 'app.apnistationery.com') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          tools: composer:2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: ./backend
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build frontend
        working-directory: ./frontend
        env:
          # Hostinger/LiteSpeed setup requires index.php front controller and Laravel api prefix.
          VITE_API_BASE_URL: https://app.apnistationery.com/api/index.php/api
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Validate deployment secrets
        run: |
          set -e
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "Missing required secret: SSH_HOST"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "Missing required secret: SSH_USER"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Missing required secret: SSH_PRIVATE_KEY"
            exit 1
          fi
          echo "Derived DEPLOY_DOMAIN=${{ env.DEPLOY_DOMAIN }}"
          echo "Derived TARGET_DIR=${{ env.TARGET_DIR }}"
          echo "Derived PUBLIC_DIR=${{ env.PUBLIC_DIR }}"

      - name: Ensure remote directories (with connectivity test)
        run: |
          echo "Testing SSH connectivity to ${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT || '22' }}"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'echo SSH_OK' || {
            echo "SSH connectivity test failed. Check SSH_HOST, SSH_PORT, and firewall settings."
            exit 2
          }
      - name: Ensure remote directories
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 180s
          command_timeout: 20m
          script: |
            set -e
            TARGET_DIR="${{ env.TARGET_DIR }}"
            PUBLIC_DIR="${{ env.PUBLIC_DIR }}"

            if [ -z "$TARGET_DIR" ] || [ -z "$PUBLIC_DIR" ]; then
              echo "TARGET_DIR or PUBLIC_DIR is empty. Check repository secrets."
              exit 1
            fi

            mkdir -p "$TARGET_DIR"
            mkdir -p "$PUBLIC_DIR"

      - name: Upload backend and frontend build
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 20m
          source: "backend,frontend/dist"
          target: ${{ env.TARGET_DIR }}

      - name: Deploy on remote
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            TARGET_DIR="${{ env.TARGET_DIR }}"
            cd "$TARGET_DIR"
            ls -la

            BACKEND_DIR="$TARGET_DIR/backend"
            if [ ! -d "$BACKEND_DIR" ]; then
              FOUND_BACKEND="$(find "$TARGET_DIR" -type d -name backend | head -n 1)"
              if [ -n "$FOUND_BACKEND" ] && [ -d "$FOUND_BACKEND" ]; then
                BACKEND_DIR="$FOUND_BACKEND"
                ln -sfn "$BACKEND_DIR" "$TARGET_DIR/backend"
              else
                echo "backend directory not found after upload."
                find "$TARGET_DIR" -maxdepth 4 -type d -print || true
                exit 1
              fi
            fi

            FRONTEND_DIST="$TARGET_DIR/frontend/dist"
            if [ ! -d "$FRONTEND_DIST" ]; then
              if [ -d "$TARGET_DIR/dist" ]; then
                FRONTEND_DIST="$TARGET_DIR/dist"
              else
                FOUND_DIST="$(find "$TARGET_DIR" -type d -path '*/frontend/dist' | head -n 1)"
                if [ -z "$FOUND_DIST" ]; then
                  FOUND_DIST="$(find "$TARGET_DIR" -maxdepth 4 -type d -name dist | head -n 1)"
                fi
                if [ -n "$FOUND_DIST" ] && [ -d "$FOUND_DIST" ]; then
                  FRONTEND_DIST="$FOUND_DIST"
                else
                  echo "frontend/dist directory not found after upload."
                  find "$TARGET_DIR" -maxdepth 4 -type d -print || true
                  exit 1
                fi
              fi
            fi

            echo "Resolved BACKEND_DIR=$BACKEND_DIR"
            echo "Resolved FRONTEND_DIST=$FRONTEND_DIST"
            echo "Using CI-built dependencies and assets; skipping remote composer/npm."
            FRONTEND_ROOT="${{ env.PUBLIC_DIR }}"
            API_ROOT="${{ env.PUBLIC_DIR }}/api"
            # Ensure frontend root exists, sync the built SPA, then create API folder
            mkdir -p "$FRONTEND_ROOT"
            echo "Syncing frontend build to web root: $FRONTEND_ROOT"
            rsync -av --delete "$FRONTEND_DIST/" "$FRONTEND_ROOT/"
            # Re-create API folder after rsync in case rsync --delete removed it
            mkdir -p "$API_ROOT"

            # Create API .htaccess to route /api/* to API front controller
            cat > "$API_ROOT/.htaccess" <<'HTACCESS'
            <IfModule mod_rewrite.c>
              <IfModule mod_negotiation.c>
                Options -MultiViews -Indexes
              </IfModule>

              RewriteEngine On

              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

              RewriteCond %{HTTP:x-xsrf-token} .
              RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_URI} (.+)/$
              RewriteRule ^ %1 [L,R=301]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ index.php [L]
            </IfModule>
            HTACCESS
            sed -i 's/^            //' "$API_ROOT/.htaccess"
            
            # Create .htaccess for React SPA routing
            # Create .htaccess for React SPA routing while excluding /api paths.
            cat > "$FRONTEND_ROOT/.htaccess" <<'HTACCESS'
            <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /

              # Serve existing files and directories directly
              RewriteCond %{REQUEST_FILENAME} -f [OR]
              RewriteCond %{REQUEST_FILENAME} -d
              RewriteRule ^ - [L]

              # Do not rewrite API requests to SPA fallback.
              RewriteCond %{REQUEST_URI} !^/api(/|$) [NC]

              # Fallback to index.html for client-side routes
              RewriteRule ^ index.html [L]
            </IfModule>
            HTACCESS
            sed -i 's/^            //' "$FRONTEND_ROOT/.htaccess"
            
            # Create API index.php that boots Laravel
            # Create API bootstrap index.php (absolute backend paths)
            cat > "$API_ROOT/index.php" <<'PHP'
            <?php
            use Illuminate\Foundation\Application;
            use Illuminate\Http\Request;

            define('LARAVEL_START', microtime(true));

            // Absolute path to backend (resolved in deploy script)
            $backendRoot = '${{ env.TARGET_DIR }}/backend';

            if (file_exists($maintenance = $backendRoot.'/storage/framework/maintenance.php')) {
              require $maintenance;
            }

            require $backendRoot.'/vendor/autoload.php';

            /** @var Application $app */
            $app = require_once $backendRoot.'/bootstrap/app.php';
            $app->handleRequest(Request::capture());
            PHP
            sed -i 's/^            //' "$API_ROOT/index.php"

            # Create a simple POST test endpoint to verify POSTs reach PHP
            cat > "$API_ROOT/test_post.php" <<'PHP'
            <?php
            header('Content-Type: application/json');
            echo json_encode([
              'method' => $_SERVER['REQUEST_METHOD'],
              'headers' => function_exists('getallheaders') ? getallheaders() : [],
              'body' => file_get_contents('php://input'),
            ]);
            PHP
            sed -i 's/^            //' "$API_ROOT/test_post.php"
            
            ln -sfn ${{ env.TARGET_DIR }}/backend/storage/app/public "$API_ROOT"/storage
            ls -la "$FRONTEND_ROOT"
            ls -la "$API_ROOT"
            ENV_PATH="${{ env.TARGET_DIR }}/backend/.env"
            if [ -n "${{ secrets.ENV_FILE }}" ]; then
              printf '%s' "${{ secrets.ENV_FILE }}" > "$ENV_PATH"
            elif [ ! -f "$ENV_PATH" ]; then
              cp "${{ env.TARGET_DIR }}/backend/.env.example" "$ENV_PATH"
            fi

            # Enforce production-safe defaults.
            if grep -q '^APP_ENV=' "$ENV_PATH"; then
              sed -i 's/^APP_ENV=.*/APP_ENV=production/' "$ENV_PATH"
            else
              echo 'APP_ENV=production' >> "$ENV_PATH"
            fi
            if grep -q '^APP_DEBUG=' "$ENV_PATH"; then
              sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' "$ENV_PATH"
            else
              echo 'APP_DEBUG=false' >> "$ENV_PATH"
            fi
            if grep -q '^APP_URL=' "$ENV_PATH"; then
              sed -i "s#^APP_URL=.*#APP_URL=https://${{ env.DEPLOY_DOMAIN }}#" "$ENV_PATH"
            else
              echo "APP_URL=https://${{ env.DEPLOY_DOMAIN }}" >> "$ENV_PATH"
            fi

            # If DB is still sqlite (default from .env.example), auto-switch to MySQL when DB_PASSWORD is provided.
            CURRENT_DB_CONNECTION="$(grep '^DB_CONNECTION=' "$ENV_PATH" | tail -n 1 | cut -d'=' -f2-)"
            if [ "$CURRENT_DB_CONNECTION" = "sqlite" ]; then
              if [ -n "${{ secrets.DB_PASSWORD }}" ]; then
                sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' "$ENV_PATH"
                if grep -q '^DB_HOST=' "$ENV_PATH"; then
                  sed -i 's/^DB_HOST=.*/DB_HOST=localhost/' "$ENV_PATH"
                else
                  echo 'DB_HOST=localhost' >> "$ENV_PATH"
                fi
                if grep -q '^DB_PORT=' "$ENV_PATH"; then
                  sed -i 's/^DB_PORT=.*/DB_PORT=3306/' "$ENV_PATH"
                else
                  echo 'DB_PORT=3306' >> "$ENV_PATH"
                fi
                if grep -q '^DB_DATABASE=' "$ENV_PATH"; then
                  sed -i "s/^DB_DATABASE=.*/DB_DATABASE=${{ secrets.SSH_USER }}_omsv2/" "$ENV_PATH"
                else
                  echo "DB_DATABASE=${{ secrets.SSH_USER }}_omsv2" >> "$ENV_PATH"
                fi
                if grep -q '^DB_USERNAME=' "$ENV_PATH"; then
                  sed -i "s/^DB_USERNAME=.*/DB_USERNAME=${{ secrets.SSH_USER }}/" "$ENV_PATH"
                else
                  echo "DB_USERNAME=${{ secrets.SSH_USER }}" >> "$ENV_PATH"
                fi
                if grep -q '^DB_PASSWORD=' "$ENV_PATH"; then
                  sed -i "s#^DB_PASSWORD=.*#DB_PASSWORD=${{ secrets.DB_PASSWORD }}#" "$ENV_PATH"
                else
                  echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> "$ENV_PATH"
                fi
              else
                echo "Deployment blocked: .env is configured for sqlite and DB_PASSWORD secret is missing."
                echo "Set either ENV_FILE secret with full production .env OR set DB_PASSWORD secret for auto mysql config."
                exit 1
              fi
            fi

            if ! grep -q '^APP_KEY=base64:' "$ENV_PATH"; then
              APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"
              if grep -q '^APP_KEY=' "$ENV_PATH"; then
                sed -i "s#^APP_KEY=.*#APP_KEY=$APP_KEY#" "$ENV_PATH"
              else
                echo "APP_KEY=$APP_KEY" >> "$ENV_PATH"
              fi
            fi
            sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' "$ENV_PATH"
            sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' "$ENV_PATH"
            sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' "$ENV_PATH"
            php -r 'if (PHP_VERSION_ID < 80300) { fwrite(STDERR, "WARNING: Server PHP ".PHP_VERSION." is below required 8.3 for this app.\n"); }'
            chown -R ${{ secrets.SSH_USER }}:www-data ${{ env.TARGET_DIR }} || true
            chmod -R 775 ${{ env.TARGET_DIR }}/backend/storage ${{ env.TARGET_DIR }}/backend/bootstrap/cache || true
            if [ -f "${{ env.TARGET_DIR }}/backend/artisan" ]; then
              php ${{ env.TARGET_DIR }}/backend/artisan optimize:clear || true
              php ${{ env.TARGET_DIR }}/backend/artisan config:cache || true
              php ${{ env.TARGET_DIR }}/backend/artisan route:cache || true
              php ${{ env.TARGET_DIR }}/backend/artisan view:cache || true
            fi

      - name: Verify remote deployment
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e
            echo "--- Listing public dir ---"
            ls -la "${{ env.PUBLIC_DIR }}" || true
            echo "--- Listing public/api dir ---"
            ls -la "${{ env.PUBLIC_DIR }}/api" || true
            echo "--- Head of api/index.php ---"
            if [ -f "${{ env.PUBLIC_DIR }}/api/index.php" ]; then
              sed -n '1,80p' "${{ env.PUBLIC_DIR }}/api/index.php"
            else
              echo "api/index.php not found"
            fi
            echo "--- curl localhost/api/test_post ---"
            curl -i --max-time 10 "http://127.0.0.1/api/test_post.php" || true
            curl -i --max-time 10 "http://localhost/api/test_post.php" || true
            echo "--- curl public domain api/test_post ---"
            curl -i --max-time 10 "https://${{ env.DEPLOY_DOMAIN }}/api/test_post.php" || true
            echo "--- curl public domain login route ---"
            curl -i --max-time 10 -X POST "https://${{ env.DEPLOY_DOMAIN }}/api/index.php/api/auth/login" -H "Accept: application/json" -H "Content-Type: application/json" -d '{}' || true
